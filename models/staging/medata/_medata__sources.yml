sources:
  - name: medata
    # Módulo 5: la descripción de la fuente reutiliza un doc block (models/_docs/conceptos.md).
    description: >
      Datos abiertos de la Alcaldía de Medellín (MEData), cargados sin transformar
      por ingest/extract_load.py.

      {{ doc("freshness_medata") }}
    schema: raw

    # -----------------------------------------------------------------------
    # Fase A · Clase "Frescura real"
    #
    # Antes: loaded_at_field = _loaded_at (cuándo cargamos NOSOTROS). Como el
    # job carga los datos justo antes de medir, siempre pasaba: no decía nada.
    #
    # Ahora: la fecha del hecho MÁS RECIENTE del archivo (dbt calcula
    # max(<expresión>)). Responde "¿qué tan viejos son los datos que publica
    # la Alcaldía?". loaded_at_field acepta cualquier expresión SQL.
    #
    # Solo warn (sin error_after): si MEData deja de publicar, el tablero se
    # sigue construyendo con lo último disponible, pero queda la advertencia.
    # Hoy avisa: los delitos llegan hasta noviembre de 2023.
    # -----------------------------------------------------------------------
    config:
      loaded_at_field: "cast(fecha_hecho as timestamptz)"
      freshness:
        warn_after: {count: 60, period: day}

    # -----------------------------------------------------------------------
    # Módulo 4 · Clase "Testing sources"
    #
    # Los tests genéricos también se declaran sobre las fuentes. Sirven para
    # atrapar problemas EN LA ENTRADA, antes de que lleguen a staging: si
    # MEData publica un archivo roto, falla aquí y no en un mart tres capas
    # más abajo, donde cuesta más encontrar la causa.
    #
    # Se prueban los campos sin los que el registro no tiene sentido.
    # Ejecutar solo los tests de fuentes:  dbt test --select source:medata
    # -----------------------------------------------------------------------
    tables:
      - name: hurto_a_persona
        description: Hurtos a personas en espacio público (SISC / Policía Nacional).
        columns:
          - name: fecha_hecho
            data_tests: [not_null]
      - name: hurto_de_moto
        description: Hurtos de motocicletas.
        columns:
          - name: fecha_hecho
            data_tests: [not_null]
      - name: hurto_de_carro
        description: Hurtos de automóviles.
        columns:
          - name: fecha_hecho
            data_tests: [not_null]
      - name: hurto_a_residencia
        description: Hurtos a viviendas.
        columns:
          - name: fecha_hecho
            data_tests: [not_null]
      - name: homicidio
        description: Homicidios.
        columns:
          - name: fecha_hecho
            data_tests: [not_null]
      - name: extorsion
        description: Extorsiones denunciadas.
        columns:
          - name: fecha_hecho
            data_tests: [not_null]
      - name: incidentes_viales
        description: Incidentes viales reportados por la Secretaría de Movilidad (2014-2020).
        # Dataset histórico cerrado (termina en 2020) y sin columna fecha_hecho: sin freshness.
        config:
          freshness: null
        columns:
          - name: FECHA_ACCIDENTE
            data_tests: [not_null]
          - name: GRAVEDAD_ACCIDENTE
            data_tests: [not_null]
      - name: proyecciones_poblacion_2020
        description: Proyección de población 2020 por comuna, corregimiento y grupo de edad.
        config:
          freshness: null
        columns:
          - name: total_2020
            data_tests: [not_null]

